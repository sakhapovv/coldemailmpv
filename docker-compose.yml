services:
  postgres:
    image: postgres:16-alpine
    container_name: emailwarmup-postgres
    environment:
      POSTGRES_DB: emailwarmup
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emailwarmup"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emailwarmup-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/emailwarmup
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SECURITY_JWT_SECRET: Q29kZXhFbWFpbFdhcm11cFRlbXBTZWNyZXRLZXlGb3JERXZlbG9wbWVudDIwMjY=
      SECURITY_JWT_EXPIRATION_MS: 3600000
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres-data:
